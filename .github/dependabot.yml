version: 2
updates:
  # Python: Dependabot understands the requirements.in -> requirements.txt
  # (pip-compile) pair and bumps both together.
  - package-ecosystem: pip
    directories:
      - /src/orchestrator
      - /src/tools
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /src/orchestrator
      - /src/tools
      - /src/orchestrator/infrastructure
    schedule:
      interval: weekly
