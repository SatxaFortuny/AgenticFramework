name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        run: |
          pip install -r src/orchestrator/requirements.txt
          pip install ruff pytest httpx

      - name: Lint
        run: ruff check src/

      - name: Run unit tests (skips anything marked 'integration')
        run: pytest -m "not integration"

  # Runs the tests that need a real database (marked `postgres`): schema
  # migrations (including several starting at once on an empty database),
  # checkpoint history surviving a "restart", and session routing surviving
  # one. They skip themselves when TEST_DATABASE_URL isn't set, which is why
  # the job above doesn't need Postgres.
  postgres-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: af
          POSTGRES_PASSWORD: af
          POSTGRES_DB: af_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U af -d af_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://af:af@localhost:5432/af_test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install orchestrator dependencies
        run: |
          pip install -r src/orchestrator/requirements.txt
          pip install pytest httpx

      - name: Run Postgres-backed tests
        run: pytest -m postgres -v

  # Catches manifest mistakes (bad indentation, wrong field names, invalid
  # kinds) before they reach the cluster. Renders the kustomization first so
  # what is validated is what `kubectl apply -k .` would actually send.
  validate-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz kubeconform

      - name: Render and validate
        run: kubectl kustomize . | ./kubeconform -strict -summary -kubernetes-version 1.30.0

  build-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build orchestrator image
        run: docker build -t af-orchestrator:ci ./src/orchestrator

      - name: Build tools image
        run: docker build -t af-tools:ci ./src/tools

      - name: Build chromadb image
        run: docker build -t af-chroma:ci -f ./src/orchestrator/infrastructure/Dockerfile.chroma ./src/orchestrator/infrastructure
