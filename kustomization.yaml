apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/01-postgres.yaml
  - k8s/02-chromadb.yaml
  - k8s/03-ollama.yaml
  - k8s/04-mcp-tools.yaml
  - k8s/05-orchestrator.yaml

# CHANGED (Batch 1 restructure): configs/config.yaml + configs/blueprint.yaml
# no longer exist - they were replaced by configs/{app}/app.yaml +
# functionalities/*.yaml + blueprints/*.yaml (see core/schemas.py:load_app).
#
# A ConfigMap has no concept of subdirectories on its own - every file here
# becomes one flat key. functionalities/greeting_bot.yaml and
# blueprints/greeting_bot.yaml would collide on the same basename, so each
# entry gets an explicit, unique key via `key=path`. The matching directory
# structure is reconstructed at mount time in k8s/05-orchestrator.yaml's
# volume `items` (that's where "functionalities-greeting_bot.yaml" becomes
# "greeting_finance_app/functionalities/greeting_bot.yaml" again).
#
# NOTE: adding a new app or a new functionality means adding a line here
# AND a matching item in 05-orchestrator.yaml - see the TODO there.
configMapGenerator:
  - name: agent-configs
    files:
      - greeting_finance_app__app.yaml=configs/greeting_finance_app/app.yaml
      - greeting_finance_app__functionalities__greeting_bot.yaml=configs/greeting_finance_app/functionalities/greeting_bot.yaml
      - greeting_finance_app__functionalities__finance_bot.yaml=configs/greeting_finance_app/functionalities/finance_bot.yaml
      - greeting_finance_app__blueprints__greeting_bot.yaml=configs/greeting_finance_app/blueprints/greeting_bot.yaml
      - greeting_finance_app__blueprints__finance_bot.yaml=configs/greeting_finance_app/blueprints/finance_bot.yaml
