apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - k8s/02-chromadb.yaml
  - k8s/03-ollama.yaml
  - k8s/04-mcp-tools.yaml
  - k8s/05-orchestrator.yaml

# Builds the "agent-configs" ConfigMap directly from configs/*.yaml,
# so there is exactly one source of truth for blueprint.yaml and config.yaml.
# Replaces the old k8s/01-configs.yaml (delete that file).
configMapGenerator:
  - name: agent-configs
    files:
      - configs/blueprint.yaml
      - configs/config.yaml
