name: af
channels:
    - conda-forge
    - defaults
dependencies:
    - python=3.11
    - pip
    - pip:
        - fastapi
        - uvicorn
        - starlette
        - httpx
        - langgraph
        - langgraph-checkpoint-postgres
        - psycopg[binary,pool]
        - langchain-core
        - langchain-ollama
        - langchain-groq
        - mcp
        - langchain-mcp-adapters
        - chromadb
        - pydantic
        - pydantic-settings
        - pyyaml
        - pytest
        - ruff
