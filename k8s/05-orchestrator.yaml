apiVersion: v1
kind: Service
metadata:
  name: orchestrator-service
spec:
  type: NodePort
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
  selector:
    app: orchestrator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: orchestrator
  template:
    metadata:
      labels:
        app: orchestrator
    spec:
      initContainers:
        # Creates/upgrades the database schema before the app starts. Runs
        # once per pod start; with several replicas starting together they
        # serialise on a Postgres advisory lock (core/persistence.py), so this
        # is safe. It also waits (up to 2 min) for Postgres to accept
        # connections, so a cold `kubectl apply` doesn't crash-loop the pod.
        - name: migrate
          image: localhost/af-orchestrator:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "migrate.py"]
          env:
            # Postgres connection, via the standard libpq variables (psycopg
            # reads these itself - see core/persistence.py). Used instead of a
            # DATABASE_URL so the password never has to be URL-encoded.
            - name: PGHOST
              value: "postgres-service"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
      containers:
        - name: orchestrator
          image: localhost/af-orchestrator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OLLAMA_HOST
              value: "http://ollama-service:11434"
            - name: CHROMA_HOST
              value: "chromadb-service"
            - name: CHROMA_PORT
              value: "8000"
            - name: LOG_LEVEL
              value: "INFO"
            - name: WEATHER_MCP_URL
              value: "http://weather-mcp-service:8000/sse"
            - name: FINANCE_MCP_URL
              value: "http://finance-mcp-service:8001/sse"
            # Postgres connection, via the standard libpq variables (psycopg
            # reads these itself - see core/persistence.py). Used instead of a
            # DATABASE_URL so the password never has to be URL-encoded.
            - name: PGHOST
              value: "postgres-service"
            - name: PGPORT
              value: "5432"
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_USER
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: PGDATABASE
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_DB
            # CHANGED: greeting_bot's model (functionalities/greeting_bot.yaml,
            # provider: groq) needs this to construct ChatGroq - without it,
            # create_model() fails with groq.GroqError at the first request
            # that builds that pipeline. Sourced from the groq-credentials
            # Secret's `GROQ_API_KEY` data key - named per-provider rather
            # than a generic `api-key`, since a shared/generic key name
            # collides the moment a second provider (OpenAI, Anthropic, etc.)
            # needs its own key in the same secret or a sibling one.
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-credentials
                  key: GROQ_API_KEY
          # /healthz = process is up (never touches the DB, so a database
          # outage can't get pods restarted). /readyz = can reach Postgres;
          # failing it just removes the pod from the Service until it recovers.
          # The startup probe gives the app up to 60 s to open its DB pool.
          startupProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8000
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8000
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            # CHANGED: three flat mounts instead of one nested-path volume.
            # CRI-O (this cluster's --container-runtime=crio) has a known bug
            # creating ConfigMap volume mounts whose items[].path contains a
            # "/" - it fails with "openat2: No such file or directory" even
            # trying to create the outer mountPath. Splitting into one volume
            # per subdirectory, each with flat (no-slash) item paths, avoids
            # that entirely: the nesting comes from three separate mountPaths
            # instead of slashes inside a single volume's items.
            - name: app-yaml-volume
              mountPath: /app/configs/greeting_finance_app
            - name: functionalities-volume
              mountPath: /app/configs/greeting_finance_app/functionalities
            - name: blueprints-volume
              mountPath: /app/configs/greeting_finance_app/blueprints
      volumes:
        - name: app-yaml-volume
          configMap:
            name: agent-configs
            items:
              - key: app.yaml
                path: app.yaml
        - name: functionalities-volume
          configMap:
            name: agent-configs
            items:
              - key: functionalities-greeting_bot.yaml
                path: greeting_bot.yaml
              - key: functionalities-finance_bot.yaml
                path: finance_bot.yaml
        - name: blueprints-volume
          configMap:
            name: agent-configs
            items:
              - key: blueprints-greeting_bot.yaml
                path: greeting_bot.yaml
              - key: blueprints-finance_bot.yaml
                path: finance_bot.yaml
      # TODO: adding a new app or functionality still means touching both
      # kustomization.yaml (the ConfigMap keys) and this file (which volume/
      # item each key lands in). Same manual-duplication note as before -
      # a Helm chart or generator script (Batch 7) is the real fix.
