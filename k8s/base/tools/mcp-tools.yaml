---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: weather-mcp
# Identity only: no RBAC is granted and no token is mounted into the pod.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finance-mcp
# Identity only: no RBAC is granted and no token is mounted into the pod.
automountServiceAccountToken: false
