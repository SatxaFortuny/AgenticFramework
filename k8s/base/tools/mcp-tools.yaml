          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          startupProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 2
            failureThreshold: 15
          readinessProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8001
            periodSeconds: 15
