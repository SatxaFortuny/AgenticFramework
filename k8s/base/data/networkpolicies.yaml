# Network policies for the data zone (ADR 0006).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
# DNS for everyone (every pod resolves the *.svc.cluster.local names in its env).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress
spec:
  podSelector:
    matchLabels: {app: postgres}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: app}}
          podSelector: {matchLabels: {app: orchestrator}}
        - podSelector:        # same namespace: the one-off bootstrap Job and the nightly backup
            matchExpressions:
              - {key: app, operator: In, values: [db-bootstrap, postgres-backup]}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: db-clients-egress
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [db-bootstrap, postgres-backup]}
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: {matchLabels: {app: postgres}}
      ports: [{protocol: TCP, port: 5432}]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: chromadb-ingress
spec:
  podSelector:
    matchLabels: {app: chromadb}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: app}}
          podSelector: {matchLabels: {app: orchestrator}}
      ports: [{protocol: TCP, port: 8000}]
# postgres and chromadb have no egress rule: DNS only.
