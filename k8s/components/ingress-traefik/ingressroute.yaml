apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: rate-limit, namespace: app}
spec:
  rateLimit: {average: 10, burst: 30}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: basic-auth, namespace: app}
spec:
  basicAuth: {secret: af-basic-auth}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata: {name: limit-body, namespace: app}
spec:
  buffering: {maxRequestBodyBytes: 1048576}
---
apiVersion: traefik.io/v1alpha1
kind: ServersTransport
metadata: {name: orchestrator-timeouts, namespace: app}
spec:
  forwardingTimeouts: {dialTimeout: 5s, responseHeaderTimeout: 120s, idleConnTimeout: 60s}
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata: {name: orchestrator, namespace: app}
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`af.example.com`)     # CHANGE
      kind: Rule
      middlewares: [{name: rate-limit}, {name: basic-auth}, {name: limit-body}]
      services:
        - name: orchestrator-service
          port: 8000
          serversTransport: orchestrator-timeouts
  tls: {secretName: af-tls}
